{% extends "base.html" %}

{% block title %}Videollamadas{% endblock %}

{% block content %}
<div class="container" style="max-width: 100%;">
    <h2 class="mb-4">Sala de Videollamada</h2>
    <div style="text-align: center; margin-bottom: 1rem;">
        <p>Haz clic en el botón para iniciar o unirte a una reunión.</p>
        <button id="start-call-btn" onclick="startVideoCall()">Iniciar Videollamada</button>
    </div>
    <div id="meet"></div>
</div>

<script src="https://meet.jit.si/external_api.js"></script>
<script>
    function startVideoCall() {
        // Remove button to prevent multiple clicks
        document.getElementById('start-call-btn').style.display = 'none';

        const domain = 'meet.jit.si';
        const options = {
            roomName: 'IntegradoraRoom_' + '{{ current_user.username }}',
            width: '100%',
            height: '100%',
            parentNode: document.querySelector('#meet'),
            userInfo: {
                displayName: '{{ current_user.username }}'
            },
            interfaceConfigOverwrite: {
                TOOLBAR_BUTTONS: [
                    'microphone', 'camera', 'closedcaptions', 'desktop', 'fullscreen',
                    'fodeviceselection', 'hangup', 'profile', 'chat', 'recording',
                    'livestreaming', 'etherpad', 'sharedvideo', 'settings', 'raisehand',
                    'videoquality', 'filmstrip', 'invite', 'feedback', 'stats', 'shortcuts',
                    'tileview', 'videobackgroundblur', 'download', 'help', 'mute-everyone'
                ]
            }
        };
        const api = new JitsiMeetExternalAPI(domain, options);
    }
</script>
{% endblock %}
